name: Backfill from the BODS archive

# Pulls "yesterday" (Europe/London) for every route in data/routes/ from Open
# Innovations' BODS archive, compiles it, and lands it on main as its own PR
# — see docs/decisions/0001-backfill-from-the-open-innovations-archive.md
# for why this can run unattended at all: fetch-archive.mjs needs no API
# key, the archive is public. A single-day call into fetch-archive-range.mjs
# (see docs/decisions/0003), which is what actually does the fetching,
# compiling, per-route skip logic, and summary generation.
#
# The PR-opening-and-merging step is ./.github/actions/merge-replay-pr,
# shared with fetch-archive-range.yml — see that action for why it can't
# just lean on ci.yml's own checks+automerge (a PR opened with the default
# GITHUB_TOKEN doesn't fire other workflows' pull_request triggers, so
# ci.yml's checks job would never run against one).

on:
  schedule:
    # 06:00 UTC. By 01:00 UTC the archive's UTC-day components of "yesterday"
    # (Europe/London) have both fully elapsed at the BODS end; how long Open
    # Innovations' own bundling takes after that isn't documented, so this
    # is a guess at a safe buffer, not a documented guarantee. A run that
    # 404s because the bundle isn't published yet fails loudly (see below)
    # rather than silently doing nothing — re-run it by hand once it is.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: "Local date to backfill (YYYY-MM-DD). Defaults to yesterday (Europe/London)."
        required: false
      routes:
        description: "Comma-separated route ids. Leave empty for every route in data/routes/."
        required: false
      force:
        description: "Re-fetch even for a date already in public/replays/."
        type: boolean
        default: false

concurrency:
  group: fetch-archive
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Determine the date to backfill
        id: date
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            date="${{ inputs.date }}"
          else
            date="$(TZ=Europe/London date -d yesterday +%F)"
          fi
          echo "date=$date" >> "$GITHUB_OUTPUT"

      - name: Backfill every route for this date
        run: >
          npm run fetch-archive-range -- --start "${{ steps.date.outputs.date }}" --end "${{ steps.date.outputs.date }}"
          ${{ inputs.routes && format('--routes {0}', inputs.routes) || '' }}
          ${{ inputs.force == 'true' && '--force' || '' }}

      - name: Check whether anything actually changed
        id: diff
        run: |
          if git diff --quiet -- public/replays/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate before pushing anything
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm test
          npm run build

      - name: Open and merge the PR
        if: steps.diff.outputs.changed == 'true'
        uses: ./.github/actions/merge-replay-pr
        with:
          branch: bot/backfill-${{ steps.date.outputs.date }}
          title: Backfill ${{ steps.date.outputs.date }} from the BODS archive
          body-file: data/archive-cache/range-summary.md
