name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  automerge:
    name: Auto-merge
    needs: checks
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Merge pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge --squash --delete-branch "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}"

      # The squash merge above runs as GITHUB_TOKEN, so the resulting push to
      # main is a GITHUB_TOKEN-authored event — GitHub deliberately doesn't
      # let those trigger further workflow runs (to avoid recursive loops),
      # so this file's own `push` trigger and deploy-pages.yml never fire on
      # their own. workflow_dispatch is the documented exception to that
      # rule, so dispatch both explicitly once the merge lands.
      - name: Trigger main-branch workflows
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml --ref main --repo "${{ github.repository }}"
          gh workflow run deploy-pages.yml --ref main --repo "${{ github.repository }}"
